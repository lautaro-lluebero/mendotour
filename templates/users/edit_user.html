{% extends "layout.html" %}
{% block title %}Editar Usuario · MendoTour{% endblock %}

{% block content %}
<section class="container">
  <h2>Editar Usuario</h2>

  {% if error %}
    <div class="flash error" style="margin-bottom:12px;">{{ error }}</div>
  {% endif %}

  <form method="post" action="{{ url_for('routes_users.update_user', id=user.id) }}" class="form-card">
    <div class="form-grid">
      <label for="username">Nombre de usuario</label>
      <input id="username" type="text" name="username" value="{{ user.username }}" required>

      <label for="email">Email</label>
      <input id="email" type="email" name="email" value="{{ user.email }}" required>

      <label for="password">Contraseña</label>
      <input id="password" type="password" name="password" placeholder="Dejar en blanco para mantener">
    </div>

    <div class="form-actions">
      <a class="btn" href="{{ url_for('routes_users.get_users') }}">Cancelar</a>
      <button class="btn edit" type="submit">Guardar cambios</button>
    </div>
  </form>
</section>
{% endblock %}
