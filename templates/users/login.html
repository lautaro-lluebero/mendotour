{% extends "layout.html" %}
{% block title %}Ingresar · MendoTour{% endblock %}
{% block head_extra %}
<link rel="stylesheet" href="{{ url_for('static', filename='auth.css') }}">
{% endblock %}

{% block content %}
<section class="auth-wrap" aria-labelledby="login-title">
  <div class="auth-card">
    <div class="auth-brand">
      <img src="{{ url_for('static', filename='img/inicio/logo.png') }}" alt="MendoTour">
    </div>

    <h2 id="login-title" class="auth-title">Iniciar sesión</h2>
    {% if error %}
      <div class="auth-alert error" role="alert">{{ error }}</div>
    {% endif %}

    <form class="auth-form" method="post" action="{{ url_for('routes_auth.login') }}">
      <label for="email">Email</label>
      <input id="email" name="email" type="email" required autocomplete="email" placeholder="tu@correo.com">

      <label for="password">Contraseña</label>
      <input id="password" name="password" type="password" required autocomplete="current-password" placeholder="••••••••">

      <button class="auth-btn" type="submit">Ingresar</button>
    </form>

    <div class="form-actions">
      <div class="form-actions-left">
        <a class="btn" href="{{ url_for('home') }}">Volver al inicio</a>
      </div>
    </div>

    <p class="auth-alt">
      ¿No tenés cuenta?
      <a href="{{ url_for('routes_users.register') }}" class="link">Registrate</a>
    </p>
    <p class="auth-back">
      <a href="{{ url_for('home') }}" class="link">← Volver al inicio</a>
    </p>
  </div>
</section>
{% endblock %}
